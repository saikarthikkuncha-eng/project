<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Marks Calculator</h1>

        <input type="text" id="name" placeholder="Student Name">

        <input type="number" id="sub1" placeholder="Subject 1 Marks">

        <input type="number" id="sub2" placeholder="Subject 2 Marks">

        <button onclick="calculateMarks()">Calculate</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
